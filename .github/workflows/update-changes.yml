
name: Update GitHub Changes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stars-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
  
      - name: Collect changes
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_changes.py

      - name: Commit results
        if: always()
        run: |
          if [ ! -f changes.json ]; then
            echo "changes.json was not generated"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily GitHub changes"
            git push
          fi
